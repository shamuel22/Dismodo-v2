  <script>
    const tl = gsap.timeline({ paused: true });
    // Camera: frame a point (cx, cy) of the 1920×1080 plate at scale s, centred on screen.
    const cam = (cx, cy, s) => ({ x: 960 - s * cx, y: 540 - s * cy, scale: s });
    // Screen position of a plate point for a camera state (for the cursor tip).
    const at = (px, py, c) => ({ x: c.x + c.scale * px - 6, y: c.y + c.scale * py - 4 });
    const A = cam(960, 262, 2.05); // the problem, read up close
    const B = cam(959, 475, 1.5); // the whole card
    const C = cam(959, 517, 1.42); // card plus the system note
    const D = cam(1175, 520, 1.02); // card left, room for the title
    // Read along the problem while the voice sets up the need.
    tl.fromTo('#open-cam', cam(880, 262, 2.15), { ...cam(1010, 268, 2.05), duration: 4.5, ease: 'power1.inOut' }, 0);
    tl.to('#open-cam', { ...B, duration: 1.1, ease: 'power2.inOut' }, 4.6);
    // Cursor: enters from the lower right, rests on "I don't know this example", taps on "tap".
    const btn = at(922, 738, B);
    tl.fromTo('#open-cursor', { x: 1980, y: 1120 }, { x: btn.x, y: btn.y, duration: 1.1, ease: 'expo.out' }, 7.7);
    tl.to('#open-cursor', { scale: 0.86, duration: 0.07, ease: 'power2.in' }, 10.26);
    tl.to('#open-cursor', { scale: 1, duration: 0.12, ease: 'power2.out' }, 10.33);
    // The tap swaps the problem into the work project: blur swap on the same stage, then reframe.
    tl.to('#open-p1', { filter: 'blur(8px)', opacity: 0, duration: 0.15, ease: 'power2.in' }, 10.32);
    tl.fromTo('#open-p2', { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.15, ease: 'power2.out' }, 10.4);
    tl.to('#open-cam', { ...C, duration: 0.7, ease: 'power2.inOut' }, 10.45);
    tl.to('#open-cursor', { x: '+=40', y: '+=150', opacity: 0, duration: 0.35, ease: 'power3.in' }, 10.6);
    // The learner marks five of twenty tasks, one tap each.
    const cell = (i) => at(657 + 39 + 87 * i, 398 + 40, C);
    tl.set('#open-cursor', { ...cell(0), y: cell(0).y + 220, opacity: 0 }, 11.3);
    tl.to('#open-cursor', { ...cell(0), opacity: 1, duration: 0.45, ease: 'expo.out' }, 11.4);
    for (let i = 0; i < 5; i++) {
      const t = 12.0 + i * 0.32;
      if (i) tl.to('#open-cursor', { ...cell(i), duration: 0.22, ease: 'power2.inOut' }, t - 0.24);
      tl.to(`#open-c${i}`, { opacity: 1, duration: 0.06 }, t);
    }
    tl.to('#open-p3', { opacity: 1, duration: 0.12 }, 13.45);
    tl.to('#open-cursor', { x: '+=60', y: '+=260', opacity: 0, duration: 0.35, ease: 'power3.in' }, 13.7);
    // Pull back: the card moves left and the title lands on the ground beside it, word by word.
    tl.to('#open-cam', { ...D, duration: 0.9, ease: 'power2.inOut' }, 14.0);
    const words = gsap.utils.toArray('#open-title .w');
    const wordAt = [14.8, 14.95, 15.5, 16.4, 16.6, 16.9];
    tl.set(words, { opacity: 0, filter: 'blur(6px)' }, 0);
    words.forEach((w, i) => tl.to(w, { opacity: 1, filter: 'blur(0px)', duration: 0.14, ease: 'power4.out' }, wordAt[i]));
    // Leave: blur out into the next world.
    tl.to(['#open-cam', '#open-title-in'], { opacity: 0, filter: 'blur(10px)', duration: 0.25, ease: 'power3.in' }, 19.33);
    window.__timelines['open'] = tl;
  </script>
